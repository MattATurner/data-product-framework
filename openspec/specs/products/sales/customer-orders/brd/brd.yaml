# Structured answers to the BRD completeness rubric (contract brd.v1).
# Requirement statements and acceptance scenarios live in spec.md beside this file.
brd_id: BRD-SALES-001
product_id: customer_orders
status: approved
version: 1.1.0
business_owner: sales-operations
data_steward: data-analytics
domain: sales
sensitivity: INTERNAL
residency: United States

changelog:
  - version: 1.1.0
    change: >
      Acceptance scenarios added for R-6, R-7 and R-8 (AX-6 to AX-8). Residency stated as a
      jurisdiction rather than an infrastructure region. Totalling answered (order value can
      be added up across days, months and customers).
    raised_by: framework review (2026-10)
    accepted_by: sales-operations
  - version: 1.0.0
    change: Initial approved version.

business_questions:
  - id: BQ-1
    text: What was on a given customer order, and what is its status?
    decision_supported: daily order enquiry and fulfilment follow-up
    consumers: [sales-operations]
  - id: BQ-2
    text: What was the total value of orders placed in a period?
    decision_supported: monthly sales reporting
    consumers: [sales-operations, data-analytics]

required_outputs:
  - id: OUT-1
    type: dataset
    figures: [order value]
    attributes: [customer, order date, status, product, quantity, line amount]
    slices: [order date, status, customer]
    satisfies: [R-1, R-2, R-4]

level_of_detail:
  drill_to: a single customer order, with its lines available alongside it
  distinct_by: each customer order appears once
  satisfies: [R-1, R-2, R-3]

history_behaviour:
  - id: HB-1
    attribute: customer details
    question: If a customer's details change, should past orders show the old or current details?
    answer: Current details are fine. There is no need to see them as they were.
    satisfies: [R-5]

totalling:
  can_be_summed_across: [days, months, customers]
  satisfies: [R-4]

timeliness:
  freshness_need: available the morning after the order is placed
  justification: reviewed in a morning stand-up; intraday freshness would change no decision
  expected_users: about 25 people, a few times each day
  satisfies: [R-6]

exceptions:
  - Cancelled orders remain visible, marked as cancelled, excluded from value totals
  - Amendments replace prior values; only the latest state is shown

fitness:
  unusable_row: no customer recorded, or a negative quantity on any line
  on_bad_data: stop and alert - do not publish
  satisfies: [R-7]

sources_believed:
  - system: example_files
    holds: orders, order lines, customers
    authority: system of record for orders

protection:
  who_may_access: [sales-operations, data-analytics]
  satisfies: [R-8]

external_readers:
  required: false
  access: only the internal reporting tool reads it; no external sharing
  satisfies: [R-8]

non_goals:
  - Forecasting and pipeline reporting
  - Margin and cost analysis

open_questions: []
