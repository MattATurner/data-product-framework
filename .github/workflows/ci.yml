name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  specs:
    name: OpenSpec (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @fission-ai/openspec@1.14.0
      - run: openspec validate --all --strict
        env:
          OPENSPEC_TELEMETRY: "0"

  gates:
    name: Gates G0-G3, golden copies, evals and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (requirements/dev.txt, hash-checked) and dpf
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      - name: Framework validation, lint and gates G0-G3 for every product
        run: dpf check --all --gate G3
      - name: Generated artefacts match the golden copies (all engines with a golden copy)
        run: dpf generate --all --check --no-write
      - name: Behavioural evals
        run: dpf eval
      - name: Unit and contract tests
        run: python -m pytest

  artefacts:
    name: Generated artefacts compile with the real tools
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Install pinned dbt toolchain (requirements/dbt.txt, hash-checked)
        run: pip install --require-hashes -r requirements/dbt.txt
      - name: Terraform fmt and validate (golden copies)
        run: |
          for d in tests/golden/*/terraform; do
            [ -d "$d" ] || continue
            terraform -chdir="$d" fmt -check -diff
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done
      - name: Dataform compile
        run: |
          for d in tests/golden/*/dataform; do
            [ -d "$d" ] || continue
            # workflow_settings.yaml pins dataformCoreVersion, which the CLI installs itself.
            npx -y @dataform/cli@3.0.71 compile "$d"
          done
      - name: dbt parse
        run: |
          for d in tests/golden/*/dbt; do
            [ -d "$d" ] || continue
            mkdir -p "$d/.ci-profiles" && cp "$d/profiles.yml.example" "$d/.ci-profiles/profiles.yml"
            dbt parse --project-dir "$d" --profiles-dir "$d/.ci-profiles" --no-partial-parse
          done
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
