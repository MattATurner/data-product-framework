# Agreed business terms. BRDs bind to these; gold column names derive from them.
# If an enterprise glossary already exists, mirror it here rather than competing with it.

terms:
  - id: net_amount
    label: Net amount
    definition: Gross amount less discount, excluding tax.
    unit: AUD
    owner: finance

  - id: order_status
    label: Order status
    definition: Lifecycle state of an order - placed, fulfilled or cancelled.
    owner: sales
