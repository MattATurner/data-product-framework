# Business entities for the worked examples and where they come from.

entities:
  - name: order
    domain: sales
    description: A customer order header.
    system_of_record: ora_local
    natural_key: [order_id]

  - name: order_line
    domain: sales
    description: A line on a customer order.
    system_of_record: ora_local
    natural_key: [order_id, order_line_no]

  - name: customer
    domain: sales
    description: A party that places orders.
    system_of_record: ora_local
    natural_key: [customer_id]

  - name: product
    domain: merchandising
    description: An item or service in the Merchandising product range.
    system_of_record: ora_local
    natural_key: [product_id]
