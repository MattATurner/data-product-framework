# Watermark extract configuration (skill extract-rdbms-watermark, ADR-015).
# Capture mode is 'watermark' (15-min schedule + 15-min lookback) because the source
# PostgreSQL database sits behind corporate NAT with no inbound route from GCP (TDD D-10).

source:
  system_id: pg_local
  jdbc_url: jdbc:postgresql://localhost:5432/sales_erp
  dsn: host=localhost port=5432 dbname=sales_erp     # overridable via PG_DSN or --dsn
  dsn_env: PG_DSN
  user_env: PGUSER
  password_env: PGPASSWORD

target:
  project: data-product-framework
  location: us-central1
  raw_dataset: raw_pg_local
  control_dataset: dpf_control

# Re-read window for transactions that commit after a run has already read past them.
# Predicate: watermark_column > last watermark - lookback_minutes. Re-read rows land
# again in raw (at-least-once); staging keeps one row per natural key + source change
# timestamp (exactly-once). Override per entity with `lookback_minutes`.
lookback_minutes: 15

# Expiry of raw_<entity>__load_<batch> tables that a failed run leaves behind.
load_table_ttl_hours: 24

entities:
  - name: orders
    source_table: sales.orders
    watermark_column: last_modified_ts
    natural_key: [order_id]
  - name: order_lines
    source_table: sales.order_lines
    watermark_column: last_modified_ts
    natural_key: [order_id, line_no]
  - name: customers
    source_table: sales.customers
    watermark_column: last_modified_ts
    natural_key: [cust_id]
  - name: products
    source_table: sales.products
    watermark_column: last_modified_ts
    natural_key: [prod_id]
