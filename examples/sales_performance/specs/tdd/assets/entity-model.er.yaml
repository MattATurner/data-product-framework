relationships:
- from: dim_customer
  from_column: sk_customer
  to: fct_order_line
  to_column: sk_customer
  from_cardinality: '1'
  to_cardinality: 0..*
  style: solid
  label: sk_customer (as at)
- from: dim_product
  from_column: sk_product
  to: fct_order_line
  to_column: sk_product
  from_cardinality: '1'
  to_cardinality: 0..*
  style: solid
  label: sk_product (as at)
- from: dim_date
  from_column: date_key
  to: fct_order_line
  to_column: date_key
  from_cardinality: '1'
  to_cardinality: 0..*
  style: solid
  label: date_key
- from: fct_order_line
  to: sales_performance_monthly
  from_cardinality: '1'
  to_cardinality: arrow
  style: dashed
  color: '#059669'
  label: agg rollup
- from: fct_order_line
  to: sales_order_line_detail
  from_cardinality: '1'
  to_cardinality: arrow
  style: dashed
  color: '#059669'
  label: 1:1 drill
