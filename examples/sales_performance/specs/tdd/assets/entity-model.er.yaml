title: Sales Performance — Entity-Relationship Model
subtitle: TDD-SALES-002 · BigQuery (us-central1) · Dimensional & Consumption Schema
groups:
- id: silver
  label: Integration Layer — Silver (Kimball)
  subtitle: 'Dataset: slv_sales'
  color: blue
- id: gold
  label: Consumption & Sharing Layer — Gold
  subtitle: 'Datasets: gold_sales, share_sales_partner'
  color: emerald
entities:
- id: dim_customer
  name: dim_customer
  schema: slv_sales
  type: dimension
  badge: DIM · SCD2
  group: silver
  subtitle: one row per customer per validity period
  description: one row per customer per validity period
  position:
    col: 0
  columns:
  - name: sk_customer
    type: INT64
    key: SK
    nullable: false
    description: Deterministic surrogate key (FARM_FINGERPRINT); -1 = Unknown member.
  - name: customer_id
    type: STRING
    key: NK
    nullable: false
    description: Natural business key from source system.
  - name: customer_segment
    type: STRING
    nullable: false
    scd2: true
    description: SCD Type 2 tracked attribute (retains point-in-time value).
  - name: region
    type: STRING
    nullable: false
    scd2: true
    description: SCD Type 2 tracked attribute (retains point-in-time value).
  - name: customer_name
    type: STRING
    nullable: true
    pii: false
    policy_tag: null
    description: Current-value attribute.
  - name: customer_email
    type: STRING
    nullable: true
    pii: true
    policy_tag: pii_contact (always_null)
    description: 'Current-value attribute. Policy tag: pii_contact (always_null)'
  - name: customer_phone
    type: STRING
    nullable: true
    pii: true
    policy_tag: pii_contact (always_null)
    description: 'Current-value attribute. Policy tag: pii_contact (always_null)'
  - name: valid_from
    type: TIMESTAMP
    key: PK
    nullable: false
    description: Inclusive start of SCD2 validity window.
  - name: valid_to
    type: TIMESTAMP
    nullable: false
    description: Exclusive end of SCD2 validity window (9999-12-31 if current).
  - name: is_current
    type: BOOL
    nullable: false
    description: TRUE for the single active version per natural key.
  keys_footer:
  - GRAIN (customer_id, valid_from)
  - CONFORMED (sales domain)
  physical_footer:
  - kind: storage
    text: TABLE · UNKNOWN MEMBER (-1)
  - kind: policy
    text: 'MASK pii_contact (always_null): customer_email, customer_phone'
