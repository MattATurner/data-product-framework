- id: dim_date
  name: dim_date
  schema: slv_sales
  type: calendar
  badge: DIM · DATE
  group: silver
  subtitle: one row per calendar day
  description: one row per calendar day
  position:
    col: 0
  columns:
  - name: date_key
    type: INT64
    key: PK
    nullable: false
    description: Integer YYYYMMDD calendar key.
  - name: calendar_date
    type: DATE
    key: UK
    nullable: false
    description: Calendar date.
  - name: year_month
    type: STRING
    nullable: false
    description: YYYY-MM reporting month.
  - name: year_quarter
    type: STRING
    nullable: false
    description: YYYY-Q# reporting quarter.
  - name: year
    type: INT64
    nullable: false
    description: Calendar year.
  - name: is_weekend
    type: BOOL
    nullable: false
    description: Weekend indicator.
  keys_footer:
  - GRAIN (date_key)
  - CONFORMED (sales domain)
  physical_footer:
  - kind: storage
    text: TABLE
- id: fct_order_line
  name: fct_order_line
  schema: slv_sales
  type: fact
  badge: FACT · INC
  group: silver
  subtitle: one row per order line at its latest amended values
  description: one row per order line at its latest amended values
  position:
    col: 1
  columns:
  - name: order_id
    type: STRING
    key: PK
    nullable: false
    description: Transaction grain key column.
  - name: order_line_no
    type: INT64
    key: PK
    nullable: false
    description: Transaction grain key column.
  - name: sk_customer
    type: INT64
    key: FK
    nullable: false
    description: Point-in-time surrogate key to dim_customer (as at order_date).
  - name: sk_product
    type: INT64
    key: FK
    nullable: false
    description: Point-in-time surrogate key to dim_product (as at order_date).
  - name: date_key
    type: INT64
    key: FK
    nullable: false
    description: Foreign key to dim_date.date_key.
  - name: order_date
    type: DATE
    nullable: false
    description: Partition event date.
  - name: quantity
    type: NUMERIC
    nullable: false
    additive: true
    description: Additive fact measure.
  - name: gross_amount
    type: NUMERIC
    nullable: false
    additive: true
    description: Additive fact measure.
  - name: discount_amount
    type: NUMERIC
    nullable: false
    additive: true
    description: Additive fact measure.
  - name: net_amount
    type: NUMERIC
    nullable: false
    additive: true
    description: Additive fact measure.
  - name: is_cancelled
    type: BOOL
    nullable: false
    description: 'Derived flag: order_status = ''CANCELLED''.'
  - name: order_status
    type: STRING
    nullable: true
    description: Degenerate transaction attribute.
  - name: source_modified_ts
    type: TIMESTAMP
    nullable: true
    description: Degenerate transaction attribute.
  keys_footer:
  - GRAIN (order_id, order_line_no)
  physical_footer:
  - kind: storage
    text: INCREMENTAL TABLE · PART BY order_date (90d)
  - kind: storage
    text: CLUSTER BY (sk_customer, sk_product)
