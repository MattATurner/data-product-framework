<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SLS — Sales Performance Data Product: Functional Hierarchy Diagram</title>
  <meta name="description" content="Modular Functional Decomposition (SLS-00) · TDD-SALES-002 — Interactive Functional Decomposition (SLS-00) with node-level functional specifications, CRUD entity matrices, and AI agent details."/>
  <meta name="keywords" content="Sales Performance, FHD, DPF, BigQuery, Dataform, Looker, Knowledge Catalog"/>
  <meta name="author" content="Matt Turner"/>
  <style>
    :root {
      --bg: #F1F5F9;
      --surface: #FFFFFF;
      --surface-alt: #F8FAFC;
      --border: #CBD5E1;
      --border-subtle: #E2E8F0;
      --text: #0F172A;
      --muted: #475569;
      --subtle: #64748B;
      --accent: #1A73E8;
      --accent-soft: #E8F0FE;
      --shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }
    html[data-theme="dark"] {
      --bg: #0B1120;
      --surface: #111827;
      --surface-alt: #1E293B;
      --border: #334155;
      --border-subtle: #1E293B;
      --text: #F8FAFC;
      --muted: #CBD5E1;
      --subtle: #94A3B8;
      --accent: #38BDF8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: 'Inter', 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    /* Header Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 18px;
      box-shadow: var(--shadow);
    }
    .title-block h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: #0F172A;
      color: #38BDF8;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .title-block p {
      margin: 3px 0 0 0;
      font-size: 12px;
      color: var(--subtle);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .controls label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
    }
    .controls select, .controls input, .controls button {
      font-size: 12px;
      font-family: inherit;
      padding: 6px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      cursor: pointer;
    }
    .controls input {
      cursor: text;
      width: 160px;
    }
    .controls button:hover {
      border-color: var(--accent);
    }
    /* Subbar: Breadcrumbs + Node Type Legend Filter */
    .subbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 14px;
    }
    .breadcrumbs {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
    }
    .crumb {
      padding: 4px 9px;
      border-radius: 6px;
      background: var(--surface-alt);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }
    .crumb.active {
      background: #0F172A;
      color: #38BDF8;
      border-color: #0F172A;
    }
    .type-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .type-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .type-chip.active {
      background: var(--text);
      color: var(--surface);
      border-color: var(--text);
    }
    .type-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    /* Main Workspace Split Grid: Left Diagram Canvas + Right Detail Card */
    .workspace-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 410px;
      gap: 14px;
      align-items: start;
      flex: 1;
    }
    .workspace-grid.card-hidden {
      grid-template-columns: minmax(0, 1fr);
    }
    .workspace-grid.card-hidden .detail-card {
      display: none;
    }
    @media (max-width: 1100px) {
      .workspace-grid {
        grid-template-columns: 1fr;
      }
      .canvas-shell {
        position: relative !important;
        top: 0 !important;
      }
    }
    .canvas-shell {
      position: sticky;
      top: 16px;
      min-width: 0;
    }
    .zoom-hud {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 4px 7px;
      border-radius: 999px;
      background: var(--surface);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-size: 11.5px;
      user-select: none;
    }
    .zoom-hud.hidden {
      display: none;
    }
    .zoom-hud button {
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 8px;
      min-width: 26px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      line-height: 1.2;
      transition: all 0.12s ease;
    }
    .zoom-hud button:hover {
      background: var(--surface-alt);
      border-color: var(--border);
      color: var(--accent);
    }
    .zoom-hud button.active {
      background: #1A73E8;
      color: #FFFFFF;
      border-color: #1A73E8;
    }
    .zoom-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      min-width: 44px;
      text-align: center;
      color: var(--text);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 5px;
    }
    .zoom-pct:hover {
      background: var(--surface-alt);
      color: var(--accent);
    }
    .zoom-sep {
      width: 1px;
      height: 15px;
      background: var(--border);
      margin: 0 2px;
    }
    .zoom-hint {
      font-size: 10.5px;
      color: var(--subtle);
      padding: 0 5px 0 3px;
      white-space: nowrap;
    }
    @media (max-width: 760px) {
      .zoom-hint { display: none; }
    }
    .controls button.btn-active-pill {
      background: #1A73E8;
      color: #FFFFFF;
      border-color: #1A73E8;
      font-weight: 600;
    }
    .btn-card-close {
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--subtle);
      cursor: pointer;
    }
    .btn-card-close:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .floating-show-card {
      display: none;
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 20;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid #1A73E8;
      background: var(--surface);
      color: var(--accent);
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .floating-show-card:hover {
      background: #1A73E8;
      color: #FFFFFF;
    }
    .workspace-grid.card-hidden .floating-show-card {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .workspace-grid.card-hidden .matrix-summary-bar {
      padding-right: 235px;
    }
    .matrix-summary-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: var(--surface-alt);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .matrix-table th {
      text-align: left;
      padding: 9px 10px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--subtle);
      background: var(--surface-alt);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .matrix-table td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: top;
      color: var(--text);
    }
    .matrix-table tr.matrix-row {
      cursor: pointer;
      transition: background 0.12s ease;
    }
    .matrix-table tr.matrix-row:hover {
      background: var(--surface-alt);
    }
    .matrix-table tr.matrix-row.selected {
      background: rgba(37, 99, 235, 0.08);
    }
    .ds-mini-pill {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: #EFF6FF;
      color: #1D4ED8;
      border: 1px solid #BFDBFE;
      margin: 0 4px 3px 0;
    }
    [data-theme="dark"] .ds-mini-pill {
      background: #1E3A8A;
      color: #BFDBFE;
      border-color: #2563EB;
    }
    .canvas-wrap {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 48px 14px 14px 14px;
      overflow: auto;
      overscroll-behavior: contain;
      box-shadow: var(--shadow);
      min-height: 520px;
      max-height: calc(100vh - 32px);
      cursor: grab;
    }
    .canvas-wrap.is-matrix {
      padding: 14px;
      cursor: default;
    }
    .canvas-wrap.is-panning {
      cursor: grabbing;
      user-select: none;
    }
    .canvas-wrap::-webkit-scrollbar,
    .detail-card::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    .canvas-wrap::-webkit-scrollbar-track,
    .detail-card::-webkit-scrollbar-track {
      background: var(--surface-alt);
      border-radius: 8px;
    }
    .canvas-wrap::-webkit-scrollbar-thumb,
    .detail-card::-webkit-scrollbar-thumb {
      background: #94A3B8;
      border-radius: 8px;
      border: 2px solid var(--surface-alt);
    }
    [data-theme="dark"] .canvas-wrap::-webkit-scrollbar-thumb,
    [data-theme="dark"] .detail-card::-webkit-scrollbar-thumb {
      background: #475569;
    }
    .canvas-wrap::-webkit-scrollbar-thumb:hover,
    .detail-card::-webkit-scrollbar-thumb:hover {
      background: #64748B;
    }
    svg {
      display: block;
      margin: 0 auto;
      max-width: none;
      flex-shrink: 0;
    }
    .fd-node-group {
      cursor: pointer;
      transition: opacity 0.18s ease;
    }
    .fd-node-group.dimmed {
      opacity: 0.22;
    }
    .fd-node-group:hover rect.main-box {
      stroke: #1A73E8;
      stroke-width: 2.25px;
    }
    .fd-node-group.selected rect.main-box {
      stroke: #2563EB;
      stroke-width: 2.75px;
      filter: drop-shadow(0 0 6px rgba(37, 99, 235, 0.32));
    }
    /* Right-Hand Functional Detail Card */
    .detail-card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 18px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .detail-header {
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
    }
    .detail-badges {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .uid-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 6px;
      background: #0F172A;
      color: #38BDF8;
    }
    .ntype-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .detail-title {
      margin: 0 0 4px 0;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }
    .detail-Path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--subtle);
    }
    .detail-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-primary, .btn-secondary {
      flex: 1;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      text-align: center;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: #1A73E8;
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: #1557B0;
    }
    .btn-secondary {
      background: var(--surface-alt);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-secondary:hover {
      border-color: var(--accent);
    }
    .detail-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .detail-section h3 {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--subtle);
    }
    .detail-section p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
    }
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--surface-alt);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px;
    }
    .meta-item span {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--subtle);
      text-transform: uppercase;
    }
    .meta-item strong {
      font-size: 12px;
      color: var(--text);
    }
    .detail-list {
      margin: 0;
      padding-left: 18px;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text);
    }
    .detail-list li {
      margin-bottom: 4px;
    }
    /* CRUD Table Matrix */
    .crud-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
    }
    .crud-table th, .crud-table td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-subtle);
      text-align: left;
    }
    .crud-table th {
      background: var(--surface-alt);
      font-size: 10.5px;
      text-transform: uppercase;
      color: var(--subtle);
    }
    .crud-op {
      display: inline-block;
      width: 20px;
      height: 20px;
      line-height: 20px;
      text-align: center;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      margin-right: 3px;
    }
    .crud-op.on-C { background: #D1FAE5; color: #065F46; }
    .crud-op.on-R { background: #DBEAFE; color: #1E40AF; }
    .crud-op.on-U { background: #FEF3C7; color: #92400E; }
    .crud-op.on-D { background: #FEE2E2; color: #991B1B; }
    .crud-op.off { background: var(--surface-alt); color: var(--subtle); opacity: 0.4; }
    /* Agent Spec Box */
    .agent-box {
      background: var(--surface-alt);
      border-left: 3px solid #7C3AED;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .skill-pill {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: #EDE9FE;
      color: #5B21B6;
      padding: 2px 7px;
      border-radius: 4px;
      margin: 2px 4px 2px 0;
    }
    .child-pill-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .child-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 7px;
      border: 1px solid var(--border-subtle);
      background: var(--surface-alt);
      cursor: pointer;
      font-size: 12px;
    }
    .child-item:hover {
      border-color: var(--accent);
    }
    .atomic-banner {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 11.5px;
      line-height: 1.45;
      border: 1px solid var(--border-subtle);
      background: var(--surface-alt);
    }
    .atomic-banner.is-atomic {
      border-left: 3px solid #F59E0B;
      background: rgba(245, 158, 11, 0.08);
    }
    .atomic-banner.is-composite {
      border-left: 3px solid #3B82F6;
    }
    .atomic-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: transparent;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .ds-bar {
      display: none;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 14px;
    }
    .ds-bar-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .ds-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--muted);
      cursor: pointer;
    }
    .ds-chip.active {
      background: #0F172A;
      color: #F8FAFC;
      border-color: #0F172A;
    }
    .ds-row-box {
      border: 1px solid var(--border-subtle);
      border-left: 4px solid #2563EB;
      border-radius: 7px;
      padding: 8px 10px;
      background: var(--surface-alt);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 6px;
    }
    .impl-box {
      border: 1px solid var(--border-subtle);
      border-left: 4px solid #2563EB;
      border-radius: 9px;
      padding: 10px 12px;
      background: var(--surface-alt);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .impl-summary {
      margin: 0;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text);
    }
    .impl-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .impl-cell {
      padding: 7px 9px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      font-size: 11.5px;
      line-height: 1.4;
    }
    .impl-cell span {
      display: block;
      font-size: 9.8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--subtle);
      margin-bottom: 2px;
    }
    .impl-cell strong {
      color: var(--text);
      font-weight: 600;
      word-break: break-word;
    }
    .impl-cmd {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 7px 10px;
      border-radius: 6px;
      background: #0F172A;
      color: #E2E8F0;
      border: 1px solid #334155;
      overflow-x: auto;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <!-- Top Header Toolbar -->
  <div class="toolbar">
    <div class="title-block">
      <h1>
        <span class="title-pill">SLS-00</span>
        <span id="hdr-title">Sales Performance Data Product</span>
      </h1>
      <p>Modular Functional Decomposition (SLS-00) · TDD-SALES-002</p>
    </div>
    <div class="controls">
      <input type="text" id="inp-search" placeholder="Search UID, terraform, cli..."/>
      <label for="sel-lens">Color Lens:</label>
      <select id="sel-lens">
        <option value="type">Architecture Node Type</option>

function syncViewportHeights() {
  const wrap = document.getElementById('svg-container');
  const card = document.getElementById('detail-panel');
  if (!wrap) return;
  if (window.innerWidth <= 1100) {
    wrap.style.maxHeight = '72vh';
    if (card) card.style.maxHeight = 'none';
    return;
  }
  const rect = wrap.getBoundingClientRect();
  const topOffset = Math.max(16, rect.top);
  const availH = Math.max(420, Math.floor(window.innerHeight - topOffset - 16));
  wrap.style.maxHeight = `${availH}px`;
  if (card) card.style.maxHeight = `${availH}px`;
}

function getFitScale() {
  const wrap = document.getElementById('svg-container');
  const availW = Math.max(300, (wrap ? wrap.clientWidth : 900) - 32);
  return Math.max(0.2, Math.min(1.0, availW / Math.max(1, lastNaturalW)));
}

function getEffectiveScale() {
  return zoomMode === 'fit' ? getFitScale() : zoomScale;
}

function updateZoomHud(scaleVal) {
  const pctEl = document.getElementById('zoom-pct-label');
  const fitBtn = document.getElementById('btn-zoom-fit');
  const oneBtn = document.getElementById('btn-zoom-100');
  if (pctEl) pctEl.textContent = `${Math.round(scaleVal * 100)}%`;
  if (fitBtn) fitBtn.classList.toggle('active', zoomMode === 'fit');
  if (oneBtn) oneBtn.classList.toggle('active', zoomMode === 'manual' && Math.abs(scaleVal - 1.0) < 0.01);
}

function applySvgZoom() {
  const wrap = document.getElementById('svg-container');
  const svgEl = wrap ? wrap.querySelector('svg') : null;
  const s = getEffectiveScale();
  if (svgEl) {
    svgEl.style.width = `${Math.round(lastNaturalW * s)}px`;
    svgEl.style.height = `${Math.round(lastNaturalH * s)}px`;
  }
  updateZoomHud(s);
}

function setDiagramZoom(nextScale, mode = 'manual', clientX = null, clientY = null) {
  const wrap = document.getElementById('svg-container');
  const svgEl = wrap ? wrap.querySelector('svg') : null;
  if (!wrap || !svgEl || currentLayout === 'matrix') return;

  const oldScale = getEffectiveScale();
  const rect = wrap.getBoundingClientRect();
  const vx = (typeof clientX === 'number') ? (clientX - rect.left) : (wrap.clientWidth / 2);
  const vy = (typeof clientY === 'number') ? (clientY - rect.top) : (wrap.clientHeight / 2);
  const contentX = (wrap.scrollLeft + vx - svgEl.offsetLeft) / oldScale;
  const contentY = (wrap.scrollTop + vy - svgEl.offsetTop) / oldScale;

  zoomMode = mode;
  if (mode === 'manual') {
    zoomScale = Math.max(0.2, Math.min(3.0, nextScale));
  }
  const applied = getEffectiveScale();
  svgEl.style.width = `${Math.round(lastNaturalW * applied)}px`;
  svgEl.style.height = `${Math.round(lastNaturalH * applied)}px`;

  if (mode === 'fit') {
    wrap.scrollLeft = 0;
    wrap.scrollTop = 0;
  } else {
    wrap.scrollLeft = Math.max(0, Math.round(contentX * applied + svgEl.offsetLeft - vx));
    wrap.scrollTop = Math.max(0, Math.round(contentY * applied + svgEl.offsetTop - vy));
  }
  updateZoomHud(applied);
}

function stepDiagramZoom(delta, clientX = null, clientY = null) {
  const cur = getEffectiveScale();
  const next = Math.round((cur + delta) * 20) / 20;
  setDiagramZoom(next, 'manual', clientX, clientY);
}

(function initCanvasZoomAndPan() {
  const wrap = document.getElementById('svg-container');
  if (!wrap) return;

  wrap.addEventListener('wheel', (e) => {
    if (currentLayout === 'matrix') return;
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const cur = getEffectiveScale();
      const clampedDelta = Math.max(-45, Math.min(45, e.deltaY));
      const factor = Math.exp(-clampedDelta * 0.0045);
      setDiagramZoom(cur * factor, 'manual', e.clientX, e.clientY);
    }
  }, { passive: false });

  let panState = null;
  let suppressClickAfterPan = false;

  wrap.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || currentLayout === 'matrix') return;
    panState = {
      x: e.clientX,
      y: e.clientY,
      sl: wrap.scrollLeft,
      st: wrap.scrollTop,
      moved: false
    };
  });

  window.addEventListener('mousemove', (e) => {
    if (!panState) return;
    const dx = e.clientX - panState.x;
    const dy = e.clientY - panState.y;
    if (!panState.moved && Math.hypot(dx, dy) > 5) {
      panState.moved = true;
      wrap.classList.add('is-panning');
    }
    if (panState.moved) {
      e.preventDefault();
      wrap.scrollLeft = panState.sl - dx;
      wrap.scrollTop = panState.st - dy;
    }
  });

  window.addEventListener('mouseup', () => {
    if (!panState) return;
    if (panState.moved) {
      suppressClickAfterPan = true;
      setTimeout(() => { suppressClickAfterPan = false; }, 50);
    }
    panState = null;
    wrap.classList.remove('is-panning');
  });

  wrap.addEventListener('click', (e) => {
    if (suppressClickAfterPan) {
      e.stopPropagation();
      e.preventDefault();
      suppressClickAfterPan = false;
    }
  }, true);
})();

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 't' || e.key === 'T') toggleTheme();

  if (e.key === 'm' || e.key === 'M') toggleMatrixView();
  if (e.key === '+' || e.key === '=') { e.preventDefault(); stepDiagramZoom(0.15); }
  if (e.key === '-' || e.key === '_') { e.preventDefault(); stepDiagramZoom(-0.15); }
  if (e.key === '0') { e.preventDefault(); setDiagramZoom(1.0, 'fit'); }
  if (e.key === '1') { e.preventDefault(); setDiagramZoom(1.0, 'manual'); }
});

function findNode(n, uid, ancestors = []) {
  if (n.uid.toUpperCase() === uid.toUpperCase()) return { ...n, ancestors };
  for (const c of (n.children || [])) {
    const found = findNode(c, uid, [...ancestors, { uid: n.uid, label: n.label }]);
    if (found) return found;
  }
  return null;
}

function pruneNode(n, relDepth) {
  const rawChildren = n.children || [];
  const totalChildren = rawChildren.length;
  const isCollapsed = collapsedUids.has(n.uid.toUpperCase());
  const children = (!isCollapsed && totalChildren > 0)
    ? rawChildren.map(c => pruneNode(c, relDepth + 1))
    : [];
  const hiddenCount = isCollapsed ? totalChildren : 0;
  return { ...n, rel_depth: relDepth, children, totalChildren, isCollapsed, hiddenCount };
}

window.toggleNodeCollapse = function(ev, uid) {
  if (ev) ev.stopPropagation();
  const key = uid.toUpperCase();
  const targetNode = findNode(TREE_DATA.root, uid);
  if (collapsedUids.has(key)) {
    // Expanding (+): reveal ONLY the immediate layer below; keep direct children collapsed
    collapsedUids.delete(key);
    if (targetNode && targetNode.children) {
      targetNode.children.forEach(c => {
        if (c.children && c.children.length > 0) {
          collapsedUids.add(c.uid.toUpperCase());
        }
      });
    }
  } else {
    // Collapsing (−): collapse this node
    collapsedUids.add(key);
  }
  selectedUid = uid;
  render();
};

function wrapTwoLines(text, maxChars) {
  const words = (text || '').trim().split(/\s+/);
  if (!words.length) return [''];
  const lines = [];
  let curr = words[0];
  for (let i = 1; i < words.length; i++) {
    if (curr.length + 1 + words[i].length <= maxChars) curr += ' ' + words[i];
    else { lines.push(curr); curr = words[i]; }
  }
  lines.push(curr);
  if (lines.length > 2) {
    let second = lines[1];
    second = second.length > maxChars - 3 ? second.slice(0, maxChars - 3) + '...' : second + '...';
    return [lines[0], second];
  }
  return lines;
}

        : (TYPE_META[c.node_type] || { badge: 'FN', badge_bg: '#F1F5F9', badge_text: '#334155', accent: '#64748B' });
      const cAtom = isNodeAtomic(c) ? `<span title="Atomic Delivery Unit" style="display:inline-block;color:${ctm.accent || '#64748B'};font-family:monospace;font-size:12px;margin-right:6px">◇</span>` : '';
      return `<div class="child-item" onclick="selectNode('${esc(c.uid)}')">
        <span><strong style="font-family:monospace">${esc(c.uid)}</strong> · ${esc(c.label)}</span>
        <span>${cAtom}<span class="ntype-badge" style="background:${ctm.badge_bg};color:${ctm.badge_text};font-size:10px">${esc(ctm.badge)}</span></span>
      </div>`;
    }).join('');
    childrenHtml = `
      <div class="detail-section">
        <h3>Direct Sub-Functions (${children.length})</h3>
        <div class="child-pill-list">${items}</div>
      </div>`;
  }

  const impl = resolveImpl(node);
  const implMeta = impl.meta;
  const implSectionHtml = `
    <div class="detail-section">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">
        <h3 style="margin:0">How It's Built &amp; Run</h3>
        <span class="ntype-badge" style="background:${implMeta.badge_bg};color:${implMeta.badge_text}" title="${esc(implMeta.full_name)}">${esc(implMeta.badge)} · ${esc(implMeta.full_name)}</span>
      </div>
      <div class="impl-box" style="border-left-color:${implMeta.accent}">
        <p class="impl-summary">${esc(impl.summary)}</p>
        <div class="impl-grid">
          <div class="impl-cell">
            <span>Day-0 Setup (Provisioned Via)</span>
            <strong>${esc(impl.provisioned_via)}</strong>
          </div>
          <div class="impl-cell">
            <span>Day-2 Runtime (Executes As)</span>
            <strong>${esc(impl.runtime)}</strong>
          </div>
          <div class="impl-cell">
            <span>How Triggered</span>
            <strong>${esc(impl.trigger)}</strong>
          </div>
          <div class="impl-cell">
            <span>Source / Entrypoint</span>
            <strong style="font-family:'JetBrains Mono',monospace;font-size:10.8px">${esc(impl.entrypoint)}</strong>
          </div>
        </div>
        ${impl.command ? `<div class="impl-cmd" title="Runnable CLI / Infrastructure Command">$ ${esc(impl.command)}</div>` : ''}
      </div>
    </div>`;

  const isCurrentRoot = node.uid.toUpperCase() === currentRootUid.toUpperCase();
  const focusBtnHtml = isCurrentRoot
    ? (node.parent_uid
        ? `<button class="btn-secondary" onclick="reroot('${esc(node.parent_uid)}')">↑ Climb to Parent (${esc(node.parent_uid)})</button>`
        : `<button class="btn-secondary" disabled>Viewing Top-Level Root</button>`)
    : `<button class="btn-primary" onclick="reroot('${esc(node.uid)}')">Focus Subtree Here (${esc(node.uid)})</button>`;
  const isNodeCollapsed = collapsedUids.has(node.uid.toUpperCase());
  const collapseBtnHtml = (children.length > 0)
    ? `<button class="btn-secondary" onclick="toggleNodeCollapse(event, '${esc(node.uid)}')">${isNodeCollapsed ? `+ Expand Layer (${children.length})` : '− Collapse Layer'}</button>`
    : '';

  document.getElementById('detail-panel').innerHTML = `
    <div class="detail-header">
      <div class="detail-badges">
        <div style="display:flex;align-items:center;gap:6px">
          <span class="uid-badge">${esc(node.uid)}</span>
          ${atomicBadgeHtml}
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="ntype-badge" style="background:${tm.badge_bg};color:${tm.badge_text}">${esc(tm.full_name)}</span>
          <button class="btn-card-close" onclick="toggleDetailCard(false)" title="Hide Right-Hand Specification Card (Shortcut: D)">✕ Hide</button>
        </div>
      </div>
      <h2 class="detail-title">${esc(node.label)}</h2>
      <div class="detail-Path">Hierarchy: ${esc(trail)}</div>
      <div class="detail-actions">
        ${focusBtnHtml}
        ${collapseBtnHtml}
      </div>
    </div>

    <div class="detail-section">
      <h3>Functional Purpose &amp; Description</h3>
      <p>${esc(d.purpose || node.description)}</p>
    </div>

    ${implSectionHtml}

    <div class="meta-grid">
      <div class="meta-item">
        <span>Target Platform</span>
        <strong>${esc(d.platform_service || 'Google Cloud')}</strong>
      </div>
      <div class="meta-item">
        <span>Owner / SLA</span>
        <strong>${esc(d.owner || 'Domain Lead')}</strong>
      </div>
    </div>

    ${typeSpecificHtml}

    ${(() => {
      const ovs = d.dataset_overlays || [];
      if (!ovs.length) return '';
      const cards = ovs.map(ov => {
        const dm = DS_BY_ID[ov.ds_id] || { id: ov.ds_id, accent: '#2563EB' };
        return `<div class="ds-row-box" style="border-left-color:${dm.accent || '#2563EB'}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:${dm.accent || '#2563EB'}">${esc(ov.ds_id)} · ${esc(ov.table || '')}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--surface);border:1px solid var(--border);color:var(--muted)">${esc(ov.role || 'DATA')}</span>
          </div>
          <div style="font-weight:600;color:var(--text)">Source: ${esc(ov.source_asset || '')}</div>
          <div style="font-size:11.5px;color:var(--subtle)">${esc(ov.notes || '')}</div>
        </div>`;
      }).join('');
      return `<div class="detail-section">
        <h3>Overlaid Datasets &amp; Source Files (${ovs.length})</h3>
        <div>${cards}</div>
      </div>`;
    })()}

    <div class="detail-section">
      <h3>Inputs &amp; Triggers</h3>
      <ul class="detail-list">${inputsHtml}</ul>
    </div>

    <div class="detail-section">
      <h3>Outputs &amp; State Changes</h3>
      <ul class="detail-list">${outputsHtml}</ul>
    </div>

    <div class="detail-section">
      <h3>Business Rules &amp; Validations</h3>
      <ul class="detail-list">${rulesHtml}</ul>
    </div>

    ${childrenHtml}
  `;
}

function render() {
  const isDark = document.documentElement.dataset.theme === 'dark';
  const rawSub = findNode(TREE_DATA.root, currentRootUid) || findNode(TREE_DATA.root, TREE_DATA.root.uid);
  selRoot.value = rawSub.uid;
  const sub = pruneNode(rawSub, 0);

  document.getElementById('hdr-title').textContent =
    `${TREE_DATA.capability_name} (Root: ${sub.uid})`;

  // Update breadcrumbs
  const crumbBar = document.getElementById('crumb-bar');
  crumbBar.innerHTML = '';
  (rawSub.ancestors || []).forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'crumb';
    btn.textContent = `${a.uid} ${a.label}`;
    btn.onclick = () => { currentRootUid = a.uid; selectedUid = a.uid; preserveScrollOnRender = false; render(); };
    crumbBar.appendChild(btn);
    const sep = document.createElement('span');
    sep.textContent = '▸';
    sep.style.color = '#94A3B8';
    crumbBar.appendChild(sep);
  });
  const activeBtn = document.createElement('button');
  activeBtn.className = 'crumb active';
  activeBtn.textContent = `${sub.uid} ${sub.label}`;
  crumbBar.appendChild(activeBtn);
  syncMatrixBtn();

  const wrapEl = document.getElementById('svg-container');
  const zoomHudEl = document.getElementById('zoom-hud');

  if (currentLayout === 'matrix') {
    wrapEl.classList.add('is-matrix');
    if (zoomHudEl) zoomHudEl.classList.add('hidden');
    const flat = [];
    function collectSub(n) {
      flat.push(n);
      (n.children || []).forEach(collectSub);
    }
    collectSub(sub);
    let mappedCount = 0;
    const rowsHtml = [];
    flat.forEach(b => {
      const bd = b.details || {};
      const dso = bd.dataset_overlays || [];
      const cruds = bd.crud_entities || [];
      const isMapped = dso.length > 0 || cruds.length > 0;
      if (isMapped) mappedCount++;

      const atomic = isNodeAtomic(b);
      const bImpl = resolveImpl(b);
      const matchesType = currentLens === 'impl'
        ? (activeImplFilter === 'all' || (activeImplFilter === 'atomic' ? atomic : bImpl.mode === activeImplFilter))
        : (activeTypeFilter === 'all' || (activeTypeFilter === 'atomic' ? atomic : b.node_type === activeTypeFilter));
      const matchesDataset = activeDatasetFilter === 'all' || nodeHasDataset(b, activeDatasetFilter);
      const searchBlob = (JSON.stringify(dso) + ' ' + JSON.stringify(cruds) + ' ' + JSON.stringify(bImpl)).toLowerCase();
      const matchesSearch = !searchQuery ||
        b.uid.toLowerCase().includes(searchQuery) ||
        b.label.toLowerCase().includes(searchQuery) ||
        b.description.toLowerCase().includes(searchQuery) ||
        searchBlob.includes(searchQuery);
      if (!matchesType || !matchesDataset || !matchesSearch) return;

      const tm = TYPE_META[b.node_type] || { badge: 'FN', badge_bg: '#DBEAFE', badge_text: '#1E40AF', accent: '#2563EB' };
      const isSel = b.uid.toUpperCase() === selectedUid.toUpperCase();
      const indentPx = b.rel_depth * 14;
      const atomMark = atomic ? `<span title="Atomic Delivery Unit" style="color:${tm.accent};font-family:monospace;font-weight:700;margin-left:5px">◇</span>` : '';

      let dsCol = '';
      let srcCol = '';
      if (dso.length > 0) {
        dsCol = dso.map(x => `<div style="margin-bottom:4px"><span class="ds-mini-pill">${esc(x.ds_id || 'DS')}</span><strong style="font-family:'JetBrains Mono',monospace;font-size:11px">${esc(x.table || '')}</strong> <span style="font-size:10px;color:var(--subtle)">[${esc(x.role || 'DATA')}]</span></div>`).join('');
        srcCol = dso.map(x => `<div style="margin-bottom:4px"><span style="font-weight:600">${esc(x.source_asset || '')}</span>${x.notes ? ` <span style="color:var(--subtle)">— ${esc(x.notes)}</span>` : ''}</div>`).join('');
      } else if (cruds.length > 0) {
        dsCol = cruds.map(c => `<div style="font-family:'JetBrains Mono',monospace;font-size:11px"><strong>${esc(c.entity)}</strong> (${esc(c.operations)})</div>`).join('');
        srcCol = `<div><strong>Setup:</strong> ${esc(bImpl.provisioned_via)}</div><div style="color:var(--subtle)"><strong>Runtime:</strong> ${esc(bImpl.runtime)}</div>`;
      } else {
        dsCol = `<span style="color:var(--subtle)">Platform: ${esc(bd.platform_service || 'Google Cloud')}</span>`;
        srcCol = `<div><strong>Setup:</strong> ${esc(bImpl.provisioned_via)}</div><div style="color:var(--subtle)"><strong>Runtime:</strong> ${esc(bImpl.runtime)}</div>`;
      }

      rowsHtml.push(`<tr class="matrix-row${isSel ? ' selected' : ''}" onclick="selectNode('${esc(b.uid)}')" ondblclick="currentLayout=lastDiagramLayout||'pillar';syncMatrixBtn();reroot('${esc(b.uid)}')">
        <td style="white-space:nowrap;padding-left:${10 + indentPx}px"><span class="uid-badge" style="font-size:11px;padding:3px 7px">${esc(b.uid)}</span>${atomMark}</td>
        <td>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px">
            <strong>${esc(b.label)}</strong>
            <span class="ntype-badge" style="background:${tm.badge_bg};color:${tm.badge_text};font-size:9.5px;padding:2px 7px">${esc(tm.badge)}</span>
            <span class="ntype-badge" style="background:${bImpl.meta.badge_bg};color:${bImpl.meta.badge_text};font-size:9.5px;padding:2px 7px" title="${esc(bImpl.meta.full_name)}">${esc(bImpl.meta.badge)}</span>
          </div>
          <div style="font-size:11.5px;color:var(--subtle)">${esc(b.description)}</div>
        </td>
        <td>${dsCol}</td>
        <td style="font-size:11.5px">${srcCol}</td>
      </tr>`);
    });

    const pct = flat.length ? Math.round((mappedCount / flat.length) * 100) : 100;
    const matrixHtml = `
      <div class="matrix-summary-bar">
        <div><strong>Process ↔ Dataset Mapping Matrix:</strong> Showing <strong>${rowsHtml.length}</strong> of <strong>${flat.length}</strong> functions · <span style="color:#059669;font-weight:700">${mappedCount}/${flat.length} (${pct}%) Mapped</span></div>
      </div>
      <table class="matrix-table">
        <thead>
          <tr>
            <th style="width:155px">UID &amp; Level</th>
            <th style="width:27%">Process Function &amp; Role</th>
            <th style="width:31%">Associated Datasets &amp; BigQuery Tables</th>
            <th>Raw Source Files / Provenance Notes</th>
          </tr>
        </thead>
        <tbody>${rowsHtml.join('')}</tbody>
      </table>`;
    wrapEl.innerHTML = matrixHtml;
    renderDetailCard(selectedUid);
    syncCardVisibility();
    syncViewportHeights();
    return;
  }

  wrapEl.classList.remove('is-matrix');
  if (zoomHudEl) zoomHudEl.classList.remove('hidden');

  // Layout computation
  const boxes = [];
  const edges = [];
  let canvasW = 880, canvasH = 400;

  if (currentLayout === 'pillar') {
    const marginX = 38, topY = 20, rootW = 450, rootH = 74, colBaseW = 398, cardH = 72, indentStep = 28, vGap = 16, colGap = 36, rootToL1 = 48;
    function maxRelD(n) {
      if (!n.children || !n.children.length) return n.rel_depth;
      return Math.max(...n.children.map(maxRelD));
    }
    const extraLevels = Math.max(0, maxRelD(sub) - 1);
    const colW = colBaseW + extraLevels * indentStep;
    const l1 = sub.children || [];
    const numCols = Math.max(1, l1.length);
    const totalColsW = numCols * colW + (numCols - 1) * colGap;
    canvasW = Math.max(rootW + 2 * marginX, totalColsW + 2 * marginX, 780);
    const colsStartX = (canvasW - totalColsW) / 2;
    const rootX = (canvasW - rootW) / 2;
    boxes.push({ ...sub, x: rootX, y: topY, w: rootW, h: rootH });
    const rootCx = rootX + rootW / 2;
    const rootBy = topY + rootH;
    const l1TopY = rootBy + rootToL1;
    const busY = rootBy + rootToL1 / 2;
    let maxBottom = rootBy;

    if (l1.length > 0) {
      edges.push({ x1: rootCx, y1: rootBy, x2: rootCx, y2: busY, color: '#64748B', w: 1.75 });
      const xs = l1.map((_, idx) => colsStartX + idx * (colW + colGap) + colW / 2).concat([rootCx]);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      if (maxX > minX) edges.push({ x1: minX, y1: busY, x2: maxX, y2: busY, color: '#64748B', w: 1.75 });
    }

    l1.forEach((l1Node, idx) => {
      const colX = colsStartX + idx * (colW + colGap);
      boxes.push({ ...l1Node, x: colX, y: l1TopY, w: colW, h: cardH });
      edges.push({ x1: colX + colW / 2, y1: busY, x2: colX + colW / 2, y2: l1TopY, color: '#64748B', w: 1.75 });
      let currY = l1TopY + cardH;

      function walkVertical(pNode, pX, pTop) {
        const ch = pNode.children || [];
        const spineX = pX - 14;
        const pMidY = pTop + cardH / 2;
        if (pNode.rel_depth === 1 && pNode.totalChildren > 0) {
          edges.push({ x1: spineX, y1: pMidY, x2: pX, y2: pMidY, color: '#94A3B8', w: 1.5 });
        }
        if (!ch.length) return;
        let lastMidY = pMidY;
        ch.forEach(c => {
          currY += vGap;
          const cX = colX + (c.rel_depth - 1) * indentStep;
          const cW = colW - (c.rel_depth - 1) * indentStep;
          const cTop = currY;
          boxes.push({ ...c, x: cX, y: cTop, w: cW, h: cardH });
          const midY = cTop + cardH / 2;
          lastMidY = Math.max(lastMidY, midY);
          edges.push({ x1: spineX, y1: midY, x2: cX, y2: midY, color: '#94A3B8', w: 1.5 });
          currY += cardH;
          if (c.children && c.children.length) walkVertical(c, cX, cTop);
        });
        edges.push({ x1: spineX, y1: pMidY, x2: spineX, y2: lastMidY, color: '#94A3B8', w: 1.5 });
      }
      walkVertical(l1Node, colX, l1TopY);
      maxBottom = Math.max(maxBottom, currY);
    });
    canvasH = maxBottom + 28;
  } else {
    const marginX = 32, topY = 20, leafW = 348, cardH = 72, hGap = 22, vGap = 46;
    function measure(n) {
      const ch = n.children || [];
      if (!ch.length) { n._w = leafW; return leafW; }
      const sum = ch.map(measure).reduce((a, b) => a + b, 0) + (ch.length - 1) * hGap;
      n._w = Math.max(leafW, sum);
      return n._w;
    }
    const totW = measure(sub);
    canvasW = Math.max(780, totW + 2 * marginX);
    let maxBottom = topY;
    function place(n, leftX, y, pCx, pBy) {
      const w = n.rel_depth === 0 ? 420 : leafW;
      const x = leftX + (n._w - w) / 2;
      boxes.push({ ...n, x, y, w, h: cardH });
      const myBy = y + cardH;
      const myCx = x + w / 2;
      maxBottom = Math.max(maxBottom, myBy);
      const ch = n.children || [];
      if (ch.length) {
        const busY = myBy + vGap / 2;
        edges.push({ x1: myCx, y1: myBy, x2: myCx, y2: busY, color: '#64748B', w: 1.75 });
        const chSum = ch.reduce((a, c) => a + c._w, 0) + (ch.length - 1) * hGap;
        let cLeft = leftX + (n._w - chSum) / 2;
        const cCenters = [];
        ch.forEach(c => {
          const cW = c._w;
          const cBoxX = cLeft + (cW - leafW) / 2;
          const cCx = cBoxX + leafW / 2;
          cCenters.push(cCx);
          edges.push({ x1: cCx, y1: busY, x2: cCx, y2: myBy + vGap, color: '#64748B', w: 1.75 });
          place(c, cLeft, myBy + vGap, myCx, myBy);
          cLeft += cW + hGap;
        });
        const allX = cCenters.concat([myCx]);
        const minX = Math.min(...allX), maxX = Math.max(...allX);
        if (maxX > minX) edges.push({ x1: minX, y1: busY, x2: maxX, y2: busY, color: '#64748B', w: 1.75 });
      }
    }
    place(sub, (canvasW - totW) / 2, topY, null, null);
    canvasH = maxBottom + 28;
  }

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Math.ceil(canvasW)} ${Math.ceil(canvasH)}" width="${Math.ceil(canvasW)}" height="${Math.ceil(canvasH)}">`;
  edges.forEach(e => {
    svg += `<line x1="${e.x1.toFixed(1)}" y1="${e.y1.toFixed(1)}" x2="${e.x2.toFixed(1)}" y2="${e.y2.toFixed(1)}" stroke="${e.color}" stroke-width="${e.w}"/>`;
  });

  boxes.forEach(b => {
    const pal = palette(b.rel_depth, b.node_type, isDark, b);
    const pillW = Math.max(54, b.uid.length * 7.4 + 12);
    const pillX = b.x + 12;
    const pillY = b.y + 11;

    const badgeStr = pal.badge;
    const badgeW = Math.max(44, badgeStr.length * 6.4 + 12);
    const badgeX = b.x + b.w - badgeW - 10;

    const atomic = isNodeAtomic(b);
    const bImpl = resolveImpl(b);

    const labelX = pillX + pillW + 8;
    const availW = badgeX - labelX - 6;
    const maxLabelChars = Math.max(15, Math.floor(availW / 6.3));
    const labelStr = b.label.length > maxLabelChars ? b.label.slice(0, maxLabelChars - 1) + '…' : b.label;
    const hasCollapseBtn = !atomic && b.totalChildren > 0;
    const descRightPad = atomic ? 36 : 20;
    const maxDescChars = Math.max(26, Math.floor((b.w - descRightPad) / 6.0));
    const dLines = wrapTwoLines(b.description, maxDescChars);

    const isSelected = b.uid.toUpperCase() === selectedUid.toUpperCase();
    const matchesType = currentLens === 'impl'
      ? (activeImplFilter === 'all' || (activeImplFilter === 'atomic' ? atomic : bImpl.mode === activeImplFilter))
      : (activeTypeFilter === 'all' || (activeTypeFilter === 'atomic' ? atomic : b.node_type === activeTypeFilter));
    const matchesDataset = activeDatasetFilter === 'all' || nodeHasDataset(b, activeDatasetFilter);
    const dsSearchStr = (JSON.stringify((b.details && b.details.dataset_overlays) || []) + ' ' + JSON.stringify(bImpl)).toLowerCase();
    const matchesSearch = !searchQuery ||
      b.uid.toLowerCase().includes(searchQuery) ||
      b.label.toLowerCase().includes(searchQuery) ||
      b.description.toLowerCase().includes(searchQuery) ||
      dsSearchStr.includes(searchQuery);
    const dimmedClass = (!matchesType || !matchesDataset || !matchesSearch) ? ' dimmed' : '';
    const selectedClass = isSelected ? ' selected' : '';

    svg += `<g class="fd-node-group${selectedClass}${dimmedClass}" onclick="selectNode('${esc(b.uid)}')" ondblclick="reroot('${esc(b.uid)}')">`;
    svg += `<rect class="main-box" x="${b.x.toFixed(1)}" y="${b.y.toFixed(1)}" width="${b.w.toFixed(1)}" height="${b.h.toFixed(1)}" rx="6" fill="${pal.fill}" stroke="${pal.stroke}" stroke-width="${b.rel_depth <= 1 ? 1.75 : 1.25}"/>`;
    svg += `<rect x="${b.x.toFixed(1)}" y="${b.y.toFixed(1)}" width="5" height="${b.h.toFixed(1)}" rx="2.5" fill="${pal.accent}"/>`;
    svg += `<rect x="${pillX.toFixed(1)}" y="${pillY.toFixed(1)}" width="${pillW.toFixed(1)}" height="20" rx="4" fill="${pal.uidBg}"/>`;
    svg += `<text x="${(pillX + pillW / 2).toFixed(1)}" y="${(pillY + 14).toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="${pal.uidText}">${esc(b.uid)}</text>`;
    svg += `<rect x="${badgeX.toFixed(1)}" y="${(pillY + 1).toFixed(1)}" width="${badgeW.toFixed(1)}" height="18" rx="4" fill="${pal.badgeBg}"/>`;
    svg += `<text x="${(badgeX + badgeW / 2).toFixed(1)}" y="${(pillY + 13).toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="${pal.badgeText}">${esc(badgeStr)}</text>`;
    svg += `<text x="${labelX.toFixed(1)}" y="${(pillY + 14.5).toFixed(1)}" font-size="12" font-weight="700" fill="${pal.label}">${esc(labelStr)}</text>`;
    if (dLines.length === 1) {
      svg += `<text x="${(b.x + 12).toFixed(1)}" y="${(b.y + 51).toFixed(1)}" font-size="11.2" fill="${pal.desc}">${esc(dLines[0])}</text>`;
    } else {
      svg += `<text x="${(b.x + 12).toFixed(1)}" y="${(b.y + 46).toFixed(1)}" font-size="10.8" fill="${pal.desc}">${esc(dLines[0])}</text>`;
      svg += `<text x="${(b.x + 12).toFixed(1)}" y="${(b.y + 60).toFixed(1)}" font-size="10.8" fill="${pal.desc}">${esc(dLines[1])}</text>`;
    }
    if (atomic) {
      const dCx = b.x + b.w - 14;
      const dCy = b.y + b.h - 12;
      const dR = 4.5;
      const pts = `${dCx.toFixed(1)},${(dCy - dR).toFixed(1)} ${(dCx + dR).toFixed(1)},${dCy.toFixed(1)} ${dCx.toFixed(1)},${(dCy + dR).toFixed(1)} ${(dCx - dR).toFixed(1)},${dCy.toFixed(1)}`;
      svg += `<g><title>Atomic Delivery Unit (Sealed Module · Cannot be decomposed further)</title><polygon points="${pts}" fill="none" stroke="${pal.accent}" stroke-width="1.5" opacity="0.85"/><circle cx="${dCx.toFixed(1)}" cy="${dCy.toFixed(1)}" r="1.2" fill="${pal.accent}" opacity="0.85"/></g>`;
    } else if (hasCollapseBtn) {
      const isCol = b.isCollapsed;
      const btnText = isCol ? '+' : '−';
      const r = 7.5;
      let cx = b.x - 14;
      let cy = b.y + b.h / 2;
      if (currentLayout === 'pillar') {
        if (b.rel_depth === 0) {
          cx = b.x + b.w / 2;
          cy = isCol ? (b.y + b.h) : (b.y + b.h + 24);
        } else {
          cx = b.x - 14;
          cy = b.y + b.h / 2;
        }
      } else {
        cx = b.x + b.w / 2;
        cy = isCol ? (b.y + b.h) : (b.y + b.h + 23);
      }
      const btnBg = isCol ? '#DBEAFE' : (isDark ? '#1E293B' : '#E2E8F0');
      const btnStroke = isCol ? '#2563EB' : (isDark ? '#94A3B8' : '#64748B');
      const btnFg = isCol ? '#1E40AF' : (isDark ? '#F8FAFC' : '#0F172A');
      const tipText = isCol
        ? `Expand immediate layer below (${b.totalChildren} direct child modules)`
        : `Collapse immediate layer below (${b.totalChildren} direct child modules)`;
      svg += `<g class="fd-collapse-btn" onclick="toggleNodeCollapse(event, '${esc(b.uid)}')">`;
      svg += `<title>${tipText}</title>`;
      svg += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" fill="${btnBg}" stroke="${btnStroke}" stroke-width="1.4"/>`;
      svg += `<text x="${cx.toFixed(1)}" y="${(cy + 3.8).toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="${btnFg}">${btnText}</text>`;
      svg += `</g>`;
    }
    svg += `</g>`;
  });
  svg += `</svg>`;
  lastNaturalW = Math.ceil(canvasW);
  lastNaturalH = Math.ceil(canvasH);
  const prevSL = wrapEl.scrollLeft;
  const prevST = wrapEl.scrollTop;
  wrapEl.innerHTML = svg;
  syncViewportHeights();
  applySvgZoom();
  if (preserveScrollOnRender) {
    wrapEl.scrollLeft = prevSL;
    wrapEl.scrollTop = prevST;
  } else {
    wrapEl.scrollLeft = 0;
    wrapEl.scrollTop = 0;
  }
  preserveScrollOnRender = true;
  renderDetailCard(selectedUid);
  syncCardVisibility();
  syncViewportHeights();
}

window.selectNode = function(uid) {
  selectedUid = uid;
  render();
};

window.reroot = function(uid) {
  currentRootUid = uid;
  selectedUid = uid;
  preserveScrollOnRender = false;
  render();
};

render();
</script>
</body>
</html>
