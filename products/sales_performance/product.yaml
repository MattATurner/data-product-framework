# Resolved design for sales_performance (contract product-manifest.v1), from TDD-SALES-002.
# Every element cites the BRD requirement it satisfies (brd_requirement_id) or the platform
# capability that mandates it (implements). dpf generate renders everything in generated/.
product_id: sales_performance
version: 1.2.0
status: draft
owner: sales-operations
steward: data-analytics
domain: sales
classification: INTERNAL-COMMERCIAL
registry_overlay: examples/registry
specs:
  brd: products/sales/sales-performance/brd
  tdd: products/sales/sales-performance/tdd
brd_id: BRD-SALES-002
tdd_id: TDD-SALES-002
satisfies: BRD-SALES-002@1.2.0
adrs: [ADR-SALES-002-01, ADR-SALES-002-02, ADR-015, ADR-018]
acceptance: acceptance.yaml

deployment:
  gcp_project: data-product-framework
  region: us-central1
  datasets:
    raw: raw_pg_local
    staging: stg_sales
    silver: slv_sales
    gold: gold_sales
    share: share_sales_partner
    assertions: dpf_assertions
    control: dpf_control
  environments:
    test:
      gcp_project: data-products-deploy
      enforce_policy_tags: false
      prevent_destroy: false
      schedules_enabled: false

sources:
  - system_id: pg_local
    engine: postgres
    capture_mode: watermark          # constrained by source reachability (D-10, ADR-SALES-002-02)
    watermark_column: last_modified_ts
    lookback_minutes: 15
    schedule: "*/15 * * * *"
    entities: [orders, order_lines, customers, products]
    inspection_mcp_server: mcp-toolbox-databases
    brd_requirement_id: [R-10]

layers:
  raw:
    storage: bigquery_native

  staging:
    engine: dataform
    storage: bigquery_native
    models:
      - name: stg_customers
        role: staging
        grain_statement: one row per customer at its latest source state
        grain_columns: [customer_id]
        natural_key: [customer_id]
        dedupe_order: [source_modified_ts DESC, _ingest_ts DESC]
        history_semantics: current_only
        materialisation: view
        body: sql/stg_customers.sql
        implements: conform-staging
        brd_requirement_id: [R-4]
      - name: stg_products
        role: staging
        grain_statement: one row per product at its latest source state
        grain_columns: [product_id]
        natural_key: [product_id]
        dedupe_order: [source_modified_ts DESC, _ingest_ts DESC]
        history_semantics: current_only
        materialisation: view
        body: sql/stg_products.sql
        implements: conform-staging
        brd_requirement_id: [R-6]
      - name: stg_order_lines
        role: staging
        grain_statement: one row per order line at its latest amended values
        grain_columns: [order_id, order_line_no]
        natural_key: [order_id, order_line_no]
        dedupe_order: [source_modified_ts DESC, _ingest_ts DESC]
        history_semantics: current_only
        materialisation: view
        body: sql/stg_order_lines.sql
        implements: conform-staging
        brd_requirement_id: [R-3, R-11]

  silver:
    methodology: kimball             # departs from the direct default (D-1, ADR-SALES-002-01)
    engine: dataform
    storage: bigquery_native
    models:
      - name: dim_customer
        role: dimension
        grain_statement: one row per customer per validity period
        grain_columns: [customer_id, valid_from]
        natural_key: [customer_id]
        surrogate_key: sk_customer
        history_semantics: point_in_time
        materialisation: table
        conformed_as: dim_customer
        attributes:
          scd_type: 2
          source: stg_customers
          tracked: [customer_segment, region]
          current: [customer_name, customer_email, customer_phone]
        brd_requirement_id: [R-4, R-5, R-12]
      - name: dim_product
        role: dimension
        grain_statement: one row per product per validity period
        grain_columns: [product_id, valid_from]
        natural_key: [product_id]
        surrogate_key: sk_product
        history_semantics: point_in_time
        materialisation: table
        conformed_as: dim_product
        attributes:
          scd_type: 2
          source: stg_products
          tracked: [product_category]
          current: [product_name]
        brd_requirement_id: [R-6]
      - name: dim_date
        role: calendar
        grain_statement: one row per calendar day
        grain_columns: [date_key]
        natural_key: [date_key]
        history_semantics: current_only
        materialisation: table
        conformed_as: dim_date
        attributes:
          start_date: "2020-01-01"
          end_date: "2030-12-31"
        brd_requirement_id: [R-1]
      - name: fct_order_line
        role: fact
        grain_statement: one row per order line at its latest amended values
        grain_columns: [order_id, order_line_no]
        natural_key: [order_id, order_line_no]
        history_semantics: current_only
        materialisation: incremental_table
        partition_by: order_date
        cluster_by: [sk_customer, sk_product]
        attributes:
          fact_type: transaction
          source: stg_order_lines
          event_date: order_date
          restatement_window_days: 90
          dim_refs:
            - {dimension: dim_customer, natural_key: customer_id, as_at: order_date}
            - {dimension: dim_product, natural_key: product_id, as_at: order_date}
            - {dimension: dim_date, from: order_date}
          measures:
            - {name: quantity, additivity: additive}
            - {name: gross_amount, additivity: additive}
            - {name: discount_amount, additivity: additive}
            - {name: net_amount, additivity: additive}
          degenerate: [order_status, source_modified_ts]
          flags:
            - {name: is_cancelled, expression: "order_status = 'CANCELLED'"}
        brd_requirement_id: [R-2, R-3, R-7, R-8, R-9]

  gold:
    methodology: direct              # presentation only; modelling is done in silver (D-2)
    engine: dataform
    storage: bigquery_native
    models:
      - name: sales_performance_monthly
        role: business_view
        grain_statement: one row per month per customer segment per product category per region
        grain_columns: [year_month, customer_segment, product_category, region]
        history_semantics: point_in_time
        materialisation: table
        body: sql/sales_performance_monthly.sql
        brd_requirement_id: [R-1, R-4, R-7, R-8]
      - name: sales_order_line_detail
        role: business_view
        grain_statement: one row per order line at its latest amended values
        grain_columns: [order_id, order_line_no]
        history_semantics: point_in_time
        materialisation: view
        body: sql/sales_order_line_detail.sql
        brd_requirement_id: [R-2, R-8, R-12]
      - name: sales_performance_partner_extract
        role: business_view
        grain_statement: one row per closed month per product category per region
        grain_columns: [year_month, product_category, region]
        history_semantics: point_in_time
        materialisation: table
        dataset: share
        schedule: monthly
        body: sql/sales_performance_partner_extract.sql
        brd_requirement_id: [R-13]

output_ports:
  - name: sales_performance_monthly
    model: sales_performance_monthly
    type: bigquery_table
    access: dataset_grant
    consumers: [sales-leadership, sales-operations, finance]
    brd_requirement_id: [R-1, R-7]
  - name: sales_order_line_detail
    model: sales_order_line_detail
    type: bigquery_view
    access: authorized_view
    consumers: [sales-operations, finance]
    brd_requirement_id: [R-2]
  - name: sales_performance_partner_extract
    model: sales_performance_partner_extract
    type: bigquery_sharing_listing
    access: sharing_listing
    consumers: [external-analytics-partner]
    sharing:
      exchange_id: sales_partner_exchange
      listing_id: sales_performance_monthly_extract
      subscriber_var: partner_subscriber
    brd_requirement_id: [R-13]
  - name: sales_performance_explore
    type: looker_explore
    explore: order_lines
    access: looker_model_set
    consumers: [sales-leadership, sales-operations, finance]
    brd_requirement_id: [R-1, R-2, R-4, R-6, R-7, R-8, R-12]
  - name: executive_sales_pulse
    type: looker_dashboard
    dashboard: executive_sales_pulse
    access: looker_folder_grant
    consumers: [sales-leadership, sales-operations]
    brd_requirement_id: [R-1, R-2, R-7]

quality:
  gate_behaviour: block
  rules:
    - id: QR-1
      model: stg_order_lines
      type: not_null
      column: customer_id
      severity: block
      on_fail: quarantine
      brd_requirement_id: [R-11]
    - id: QR-2
      model: stg_order_lines
      type: range
      column: quantity
      min: 0
      severity: block
      on_fail: quarantine
      brd_requirement_id: [R-11]

orchestration:
  engine: dataform
  timezone: Australia/Perth
  schedules:
    - id: hourly
      cron: "10 * * * *"             # ten past, after the hourly extract
      brd_requirement_id: [R-10]
    - id: monthly
      cron: "0 7 2 * *"              # 07:00 on the 2nd, once the month has closed
      brd_requirement_id: [R-13]

observability:
  freshness:
    - id: OB-1
      model: sales_performance_monthly
      max_staleness: PT1H30M
      calendar: {days: [MON, TUE, WED, THU, FRI], start: "08:00", end: "18:00", timezone: Australia/Perth}
      check_every: PT15M
      brd_requirement_id: [R-10]
    - id: OB-2
      model: sales_performance_partner_extract
      max_staleness: P32D
      check_every: P1D
      brd_requirement_id: [R-13]
  volume:
    - id: OB-3
      model: fct_order_line
      window: P1D
      date_column: order_date
      expected_rows: 40000
      tolerance_pct: 60
      implements: monitor-data-product
  schema_drift:
    on_additive: land_and_record
    on_breaking: quarantine_and_alert
    implements: monitor-data-product
  quality_scans:
    schedule: "30 6 * * *"
    models: [fct_order_line, sales_performance_monthly]
    implements: enforce-data-quality
  alerting:
    notification_channel_var: alert_channel
    runbook: examples/sales_performance/RUNBOOK.md
  slo:
    objective: 0.99
    window: P28D

governance:
  register: knowledge_catalog
  registered_via: knowledge-catalog-mcp
  fallback: dataplex_api
  access:
    - role: roles/bigquery.dataViewer
      principal_var: consumer_group
      datasets: [gold]
      description: Sales leadership, Sales Operations and Finance
    - role: roles/bigquery.dataViewer
      principal_var: analyst_group
      datasets: [gold, silver]
      description: General analysts; customer contact details are masked
  policy_tags:
    - id: PT-1
      model: dim_customer
      columns: [customer_email, customer_phone]
      tag: pii_contact
      masking: always_null
      masked_readers: [analyst_group]
      fine_grained_readers: [contact_reader_group]
      brd_requirement_id: [R-12]

semantic_layer:
  targets: [lookml]
  looker:
    connection: bigquery_sales
    project_name: sales_performance
    auth_mode: oauth
    datagroup_max_cache_age: "90 minutes"
  metrics:
    - name: net_sales
      label: Net Sales (AUD)
      type: simple
      model: fct_order_line
      expr: net_amount
      filter: "is_cancelled = FALSE"
      description: Net sales in AUD excluding tax and cancelled order lines.
    - name: units_sold
      label: Units Sold
      type: simple
      model: fct_order_line
      expr: quantity
      filter: "is_cancelled = FALSE"
      description: Total units sold excluding cancelled order lines.
  explores:
    - name: order_lines
      from: fct_order_line
      label: "Sales Performance — Order Lines"
      description: "Order-line sales joined to point-in-time customer segment, product category and calendar."
      joins: auto
      always_filter_partition: true
      partition_default_filter: "90 days"
      aggregate_tables: [sales_performance_monthly]
      brd_requirement_id: [R-1, R-2, R-4, R-6, R-7, R-8, R-12]
  dashboards:
    - name: executive_sales_pulse
      title: Executive Sales Performance
      description: "Stephen Few operational summary of net sales, units sold and order-line detail."
      explore: order_lines
      brd_requirement_id: [R-1, R-2, R-7]
      filters:
        - name: order_date
          title: Order Date
          field: fct_order_line.order_date
          type: date_filter
          default_value: "90 days"
        - name: region
          title: Region
          field: dim_customer.region
        - name: customer_segment
          title: Customer Segment
          field: dim_customer.customer_segment
        - name: product_category
          title: Product Category
          field: dim_product.product_category
      tiles:
        - name: kpi_net_sales
          title: Net Sales (AUD)
          kind: kpi
          measures: [fct_order_line.net_sales]
        - name: kpi_units_sold
          title: Units Sold
          kind: kpi
          measures: [fct_order_line.units_sold]
        - name: kpi_order_lines
          title: Order Lines
          kind: kpi
          measures: [fct_order_line.count]
        - name: monthly_net_sales_trend
          title: Monthly Net Sales Trend
          kind: time_series
          dimensions: [dim_date.year_month]
          measures: [fct_order_line.net_sales]
          sorts: [dim_date.year_month asc]
        - name: net_sales_by_region
          title: Net Sales by Region
          kind: ranked_bar
          dimensions: [dim_customer.region]
          measures: [fct_order_line.net_sales]
          y_axis_zero: true
        - name: net_sales_by_category
          title: Net Sales by Product Category
          kind: ranked_bar
          dimensions: [dim_product.product_category]
          measures: [fct_order_line.net_sales]
          y_axis_zero: true
        - name: order_line_drill_detail
          title: Order Line Drill-Down Detail
          kind: table
          dimensions:
            - fct_order_line.order_id
            - fct_order_line.order_line_no
            - fct_order_line.order_date
            - dim_customer.customer_name
            - dim_customer.customer_segment
            - dim_product.product_category
            - fct_order_line.order_status
          measures:
            - fct_order_line.net_sales
            - fct_order_line.units_sold
          limit: 100
