id: monitor-breach
asserts: A freshness breach in business hours fails dpf monitor and opens an OpenSpec change quoting it.
run:
  command: monitor
  product: sales_performance
  evidence: run-evidence.json
  open_change: true
expect:
  outcome: fail
  messages:
  - 'freshness OB-1: sales_performance_monthly is 150 minutes old (limit 90)'
  files:
  - openspec/changes/monitor-sales-performance-freshness-*/proposal.md
  - openspec/changes/monitor-sales-performance-freshness-*/.openspec.yaml
