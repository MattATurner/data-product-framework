id: unsupported-engine
asserts: Kimball dimensions on a streaming engine fail compose instead of generating code that misbehaves.
mutate:
- set:
    file: products/sales_performance/product.yaml
    path: layers.silver.engine
    value: dataflow
run:
  command: compose
  product: sales_performance
expect:
  outcome: fail
  messages:
  - does not support engine 'dataflow' for role 'dimension'
