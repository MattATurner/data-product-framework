id: no-methodology-envy
asserts: >
  A methodology is a cost paid for a benefit. A simple product must not be steered into
  a star schema it does not need.

given:
  brd_signals:
    sources: 1
    consumer_groups: 1
    history_required: false
    cross_domain_reconciliation: false

expect:
  recommended_methodology: direct
  reject: [kimball, data-vault-2]
  rationale_contains: ["no cross-domain reconciliation", "current state"]
