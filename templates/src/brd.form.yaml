# Content of the BRD template (Define, step 4 - the alternative is the PRD). Rendered by render.py.
#
# Each section answers one or more questions of the BRD completeness rubric
# (registry/brd-rubric.yaml, groups A to K). `maps_to` says where the answer is recorded in the
# repository; render.py prints it in the appendix for the data team.

name: brd
file: 4a-brd
title: Business requirements document (BRD)
stage: Define
step: 4
alternative: Use the BRD or the PRD (4b), not both. They feed the design in the same way.
intro: >
  Describe what the business needs from the data product, in business language. The data team
  turns your answers into a design, then explains that design back to you in plain words for
  your signature before anything is built.
how_to:
  - Use business terms. Do not name technologies or modelling techniques; the data team chooses those in the design.
  - Give every requirement at least one worked example of a correct answer.
  - If something is not decided yet, add it to Open questions with an owner and a due date. Do not guess.

control:
  - {id: doc_id, label: BRD ID, hint: "For example BRD-SALES-002"}
  - {id: product, label: Data product}
  - {id: owner, label: Business owner}
  - {id: steward, label: Data steward}
  - {id: domain, label: Business domain}
  - {id: use_case, label: Use case, hint: "The approved use case, for example UC-SALES-001"}
  - {id: version, label: Version, default: "0.1.0"}
  - {id: date, label: Date}
  - {id: status, label: Status, kind: choice, options: [Draft, In review, Approved], wide: true}

sections:
  - id: changelog
    title: Change history
    numbered: false
    maps_to: "brd.yaml: changelog"
    fields:
      - id: changelog
        kind: grid
        rows: 3
        columns:
          - {id: version, label: Version, width: 11}
          - {id: change, label: What changed, width: 53}
          - {id: raised_by, label: Raised by, width: 18}
          - {id: accepted_by, label: Accepted by, width: 18}

  - id: purpose
    title: Purpose
    hint: Why does the business need this? Who benefits, and what will they do differently?
    maps_to: "spec.md: Purpose"
    fields:
      - {id: purpose, kind: area, lines: 4}

  - id: questions
    title: Business questions
    rubric: A
    hint: What questions must this answer, who needs the answers, and which decision does each answer support?
    maps_to: "brd.yaml: business_questions"
    fields:
      - id: questions
        kind: grid
        rows: 4
        columns:
          - {id: id, label: ID, width: 9, default: "BQ-{n}"}
          - {id: text, label: Question, width: 39}
          - {id: decision, label: Decision it supports, width: 30}
          - {id: consumers, label: Who needs the answer, width: 22}

  - id: outputs
    title: What you need to see
    rubric: B
    hint: "Which outputs do you need: a dashboard, report, extract, API or dataset? Which figures, broken down by what, and which details?"
    maps_to: "brd.yaml: required_outputs"
    fields:
      - id: outputs
        kind: grid
        rows: 4
        columns:
          - {id: id, label: ID, width: 9, default: "OUT-{n}"}
          - {id: type, label: Type, width: 11}
          - {id: figures, label: Figures, width: 17}
          - {id: slices, label: Broken down by, width: 19}
          - {id: attributes, label: Details shown, width: 20}
          - {id: recipient, label: "For whom, how often", width: 14}
          - {id: satisfies, label: Req. IDs, width: 10}

  - id: detail
    title: Level of detail
    rubric: C
    maps_to: "brd.yaml: level_of_detail"
    fields:
      - {id: drill_to, label: Finest level of detail, hint: "What is the finest level you need to drill down to? For example \"an individual line on a customer order\".", kind: area, lines: 2}
      - {id: distinct_by, label: What makes each one distinct, hint: "Could two records ever describe the same thing? If so, which one counts?", kind: area, lines: 2}

  - id: history
    title: When values change
    rubric: D
    hint: If a value such as a customer's segment or a product's category changes, should past figures follow the change or stay as they were?
    maps_to: "brd.yaml: history_behaviour"
    fields:
      - id: history
        kind: grid
        rows: 3
        columns:
          - {id: id, label: ID, width: 9, default: "HB-{n}"}
          - {id: attribute, label: What can change, width: 22}
          - {id: answer, label: "Should past figures follow the change or stay as they were? Why?", width: 69}

  - id: timing
    title: Timing and volume
    rubric: E
    maps_to: "brd.yaml: timeliness"
    fields:
      - {id: freshness_need, label: How fresh, hint: "How up to date must the figures be? For example \"hourly during the working day\".", kind: line}
      - {id: justification, label: Why, hint: "Which decision depends on that freshness? What goes wrong if the figures are late?", kind: area, lines: 2}
      - {id: expected_users, label: Users, hint: "Roughly how many people will use it, and how often?", kind: line}
      - {id: peak_volume, label: Volume, hint: "Roughly how many records arrive on a busy day?", kind: line}

  - id: exceptions
    title: Exceptions
    rubric: F
    hint: What should happen with cancellations, refunds, amendments and late corrections? One per line.
    maps_to: "brd.yaml: exceptions"
    fields:
      - {id: exceptions, kind: area, lines: 4}

  - id: fitness
    title: Bad data
    rubric: G
    maps_to: "brd.yaml: fitness"
    fields:
      - {id: unusable_row, label: Unusable record, hint: "What would make a record unusable to you?", kind: area, lines: 2}
      - id: on_bad_data
        label: When bad data arrives
        kind: choice
        options:
          - Stop and alert - do not publish
          - Publish the good records and report the bad ones
          - Publish everything and flag the bad records

  - id: sources
    title: Sources
    rubric: H
    hint: Which systems do you believe hold this data, and which one is the authority?
    maps_to: "brd.yaml: sources_believed"
    fields:
      - id: sources
        kind: grid
        rows: 3
        columns:
          - {id: system, label: System, width: 22}
          - {id: holds, label: What it holds, width: 50}
          - {id: authority, label: "Is it the authority?", width: 28}

  - id: protection
    title: Protection and access
    rubric: I
    maps_to: "brd.yaml: sensitivity, residency, protection, external_readers"
    fields:
      - {id: sensitivity, label: Sensitivity, hint: "Your organisation's classification, for example Internal or Confidential.", kind: line}
      - {id: residency, label: Where the data must stay, hint: "A country or jurisdiction, for example \"United States\".", kind: line}
      - {id: restricted, label: Details some users must not see, hint: "For example customer contact details.", kind: area, lines: 2}
      - {id: visible, label: What those users may still see, kind: area, lines: 2}
      - {id: who_may_access, label: Who may see the data, kind: area, lines: 2}
      - {id: external, label: Readers outside the organisation, hint: "Does anyone outside the organisation need this data? Who, and how may they receive it?", kind: area, lines: 2}

  - id: agreement
    title: Agreement with other teams and totals
    hint: Must these figures agree with another team's figures? Can they be added up across time, regions and other breakdowns?
    maps_to: "brd.yaml: agreement_with_other_teams, totalling"
    fields:
      - id: agreement
        kind: grid
        rows: 2
        columns:
          - {id: id, label: ID, width: 9, default: "AG-{n}"}
          - {id: team, label: Team, width: 24}
          - {id: must_agree_on, label: Must agree on, width: 67}
      - {id: totalling, label: Can be added up across, hint: "For example days, months, regions and categories.", kind: line}

  - id: requirements
    title: Requirements and acceptance examples
    rubric: J
    hint: >
      One requirement for each behaviour you need, written as "Users SHALL ..." or "Figures
      SHALL ...". Give at least one worked example of a correct answer: GIVEN a situation,
      WHEN someone does something, THEN what they should see.
    maps_to: "spec.md: one Requirement per R-n, one Scenario per AX-n"
    fields:
      - {id: requirements, kind: requirements, count: 8}

  - id: scope
    title: Out of scope
    rubric: K
    hint: What is explicitly out of scope? Saying so now avoids surprises later.
    maps_to: "brd.yaml: non_goals; spec.md: Scope"
    fields:
      - {id: non_goals, kind: area, lines: 3}

  - id: open
    title: Open questions
    hint: Anything not yet decided. Give each question an owner and a due date, and say what we assume if work starts before it is answered.
    maps_to: "brd.yaml: open_questions; spec.md: Open questions"
    fields:
      - id: open_questions
        kind: grid
        rows: 3
        columns:
          - {id: id, label: ID, width: 8, default: "OQ-{n}"}
          - {id: question, label: Question, width: 32}
          - {id: owner, label: Owner, width: 14}
          - {id: due, label: Due, width: 10}
          - {id: assumption, label: What we assume meanwhile, width: 22}
          - {id: blast_radius, label: What it affects, width: 14}

signoff:
  title: Approval
  hint: The business owner approves the BRD. Teams whose figures must agree with these (see Agreement with other teams) should sign too.
  rows: [Business owner, Data steward, "", ""]

next: >
  The data team records the approved BRD in the repository and checks it is complete (gate G0).
  They then write the technical design (TDD) and explain it back to you in plain words. You sign
  that explanation before anything is built (gate G1).
