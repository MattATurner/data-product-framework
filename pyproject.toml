[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpf"
dynamic = ["version"]
description = "Data Product Framework: spec-driven, composable data engineering from define to monitor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4.18",
  "referencing>=0.30",
]

[project.optional-dependencies]
# Needed only for `dpf test run --live`, `dpf monitor` without --evidence, and the extractor.
gcp = ["google-cloud-bigquery>=3.20"]
dev = ["pytest>=8"]

[project.scripts]
dpf = "dpf.cli:main"

[tool.setuptools]
packages = ["dpf", "dpf.generate"]

[tool.setuptools.dynamic]
version = { attr = "dpf.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contracts"]
addopts = "-q"
